name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run end-to-end synthetic smoke test
        run: |
          python show_all_results.py --synthetic --n-customers 200 --days 90 --seed 42

      - name: Run data generator smoke test
        run: |
          python data_generator.py --customers 100 --start 2025-01-01 --seed 42 --output /tmp/test_output

      - name: Check code style (ruff)
        if: always()
        run: |
          ruff check . --output-format=github

      - name: Check formatting (ruff format)
        if: always()
        run: |
          ruff format . --check

  # Optional: Run on main branch with additional checks
  release-check:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Full test suite
        run: |
          python -m pytest tests/ -v --tb=long
      - name: Verify clean checkout
        run: |
          python show_all_results.py --synthetic --n-customers 300 --days 120 --seed 42